services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT in your environment}
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
